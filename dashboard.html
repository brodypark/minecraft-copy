<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Dashboard</title>
<style>
  :root {
    --bg: #0f1218;
    --card: #1a1f2b;
    --text: #e8ecf3;
    --muted: #8a93a6;
    --idle: #4a5266;
    --working: #f5a623;
    --done: #3ecf8e;
    --failed: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 24px 12px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  #sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  #stage { position: relative; width: 680px; height: 680px; max-width: 100%; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .line { stroke: var(--idle); stroke-width: 2; transition: stroke .3s; }
  .line.working { stroke: var(--working); stroke-dasharray: 6 6; animation: dash 1s linear infinite; }
  .line.done { stroke: var(--done); }
  .line.failed { stroke: var(--failed); }
  @keyframes dash { to { stroke-dashoffset: -12; } }
  .box {
    position: absolute; width: 170px; padding: 12px; border-radius: 14px;
    background: var(--card); border: 2px solid var(--idle);
    transform: translate(-50%, -50%); text-align: center; transition: border-color .3s, box-shadow .3s;
  }
  .box.manager { width: 200px; padding: 18px 14px; }
  .box .name { font-weight: 600; font-size: 15px; }
  .box .status { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 4px 0; color: var(--idle); }
  .box .task { font-size: 12px; color: var(--muted); min-height: 30px; overflow-wrap: anywhere; }
  .box.working { border-color: var(--working); box-shadow: 0 0 18px rgba(245,166,35,.35); animation: pulse 1.4s ease-in-out infinite; }
  .box.working .status { color: var(--working); }
  .box.done { border-color: var(--done); }
  .box.done .status { color: var(--done); }
  .box.failed { border-color: var(--failed); }
  .box.failed .status { color: var(--failed); }
  @keyframes pulse { 50% { box-shadow: 0 0 28px rgba(245,166,35,.6); } }
  #err { color: var(--failed); font-size: 13px; min-height: 18px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Agent Dashboard</h1>
  <div id="sub">Refreshes every 2 seconds from status.json</div>
  <div id="stage">
    <svg id="lines" viewBox="0 0 680 680"></svg>
  </div>
  <div id="err"></div>

<script>
  const SIZE = 680, CX = SIZE / 2, CY = SIZE / 2, RADIUS = 250;
  const stage = document.getElementById('stage');
  const svg = document.getElementById('lines');

  // Build 1 manager + 6 agent boxes once, then update them in place.
  const managerEl = makeBox('manager', CX, CY);
  const agentEls = [];
  const lineEls = [];
  for (let i = 0; i < 6; i++) {
    const angle = (-90 + i * 60) * Math.PI / 180;
    const x = CX + RADIUS * Math.cos(angle);
    const y = CY + RADIUS * Math.sin(angle);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', CX); line.setAttribute('y1', CY);
    line.setAttribute('x2', x); line.setAttribute('y2', y);
    line.setAttribute('class', 'line');
    svg.appendChild(line);
    lineEls.push(line);
    agentEls.push(makeBox('', x, y));
  }

  function makeBox(extraClass, x, y) {
    const el = document.createElement('div');
    el.className = 'box ' + extraClass;
    el.style.left = (x / SIZE * 100) + '%';
    el.style.top = (y / SIZE * 100) + '%';
    el.innerHTML = '<div class="name"></div><div class="status"></div><div class="task"></div>';
    stage.appendChild(el);
    return el;
  }

  function normalize(s) {
    return ['idle', 'working', 'done', 'failed'].includes(s) ? s : 'idle';
  }

  function render(el, data, isManager) {
    const status = normalize(data && data.status);
    el.className = 'box ' + (isManager ? 'manager ' : '') + status;
    el.querySelector('.name').textContent = (data && data.name) || (isManager ? 'Manager' : 'Agent');
    el.querySelector('.status').textContent = status;
    el.querySelector('.task').textContent = (data && data.task) || '';
    return status;
  }

  async function refresh() {
    try {
      const res = await fetch('status.json?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      render(managerEl, data.manager, true);
      (data.agents || []).slice(0, 6).forEach((a, i) => {
        const status = render(agentEls[i], a, false);
        lineEls[i].setAttribute('class', 'line ' + status);
      });
      document.getElementById('err').textContent = '';
    } catch (e) {
      document.getElementById('err').textContent =
        'Could not read status.json (' + e.message + '). Serve this folder with: python3 -m http.server 8000';
    }
  }

  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
